[project]
name = "hourglass"
version = "0.1.0"
description = "Principle of Least Effort in Depth: the Diverge–Converge–Diverge hourglass in multilingual language models"
readme = "README.md"
authors = [{ name = "Anh Trac Duc Dinh" }]
# numpy==1.26.4 (pin của notebook Study 1) không có wheel cho Python 3.13
requires-python = ">=3.10,<3.13"
# Phiên bản lấy từ các cell `%uv pip install` của notebook gốc (Study 1 pin chặt nhất -> dùng chung).
dependencies = [
    "numpy==1.26.4",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "scikit-learn",
    "statsmodels",
    "tabulate",
    "pyarrow",
    "torch==2.8.0",
    "transformers==4.57.1",
    "datasets==4.0.0",
    "huggingface_hub==0.36.0",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "safetensors",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Study 4: tách từ đa ngữ, UPOS, gióng hàng, loại hình (cell 1 của notebook Study 4)
study4 = [
    "regex",
    "eflomal",
    "lang2vec",
    "setuptools<81",
    "jieba",
    "pyvi",
    "pythainlp",
    "fugashi",
    "unidic-lite",
    "stanza",
    "opencc-python-reimplemented",
    "zhconv",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel",
]

[project.scripts]
hourglass = "hourglass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hourglass"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
# Mã study (src/hourglass/study*/) là mã nghiên cứu giữ NGUYÊN VĂN từ notebook và chạy trong namespace chung
# (tên đến từ file khác) -> không lint / format, để diff luôn đối chiếu được với notebook gốc.
extend-exclude = ["src/hourglass/study*", "notebooks/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
# common/ cũng là mã nguyên văn từ notebook (kiểm bằng test parity): giữ tên biến `l` (= ngôn ngữ) và zip() gốc
"src/hourglass/common/*" = ["E741", "B905"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: chạy lâu (vài phút), bỏ qua bằng -m 'not slow'",
    "torch: cần torch",
]
filterwarnings = ["ignore::DeprecationWarning"]
