# Study 2a chạy thử cực nhỏ (vài phút) để kiểm tra cả đường ống trước khi tốn GPU.
# Kết quả nằm riêng ở outputs/study2a_smoke/ (kể cả bảng + hình), không lẫn kết quả thật.
defaults:
  - experiment/study2a

SMOKE: true
N_POOL: 12000                 # cỡ smoke của notebook (_S(400_000, 12_000))
RUN_GRIDS: ["smoke"]
ANALYSIS_DIR: ${OUTPUT_DIR}/study2a_smoke/analysis
FIG_DIR: ${OUTPUT_DIR}/study2a_smoke/figures
