# Study 2a — mô hình tí hon K=8 tầng, 4 họ (decoder / encoder / MoE / diffusion).
K_LAYERS: 8
D_HEAD: 32
D_MAIN: 192  # d của mọi lưới (B ≈ 3,5M tham số không-embedding)
AUX_FRAC: 0.2  # tỉ lệ chuỗi trong batch có nhãn phụ (SEM / SURF)
AUX_W: 1.0  # trọng số loss nhãn phụ so với loss LM trung bình
MOE_AUX: 0.01  # hệ số load-balancing của MoE
